# 校验清单，不驱动安装。
# scripts/install.sh / install.ps1 不解析本文件：安装范围是「整包软链」，
# 安装脚本把整个 skill 目录链接到 ~/.claude/skills/ 或 ~/.codex/skills/。
# 本文件由 scripts/validate.sh #7 消费，用于防止关键文件漏登记或路径写错。
# 改这里不会改变安装行为。
id: "core"
description: "Install the multi-agent-project-skill (project skeleton initializer + coordination protocol)."
skills:
  - name: "multi-agent-project-skill"
    source_files:
      - "SKILL.md"
      - "agents/"
      - "references/"
      - "scripts/init_workspace.py"
      - "scripts/validate.sh"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/release.sh"
      - "scripts/doc-impact-check.sh"
      - "scripts/githooks/pre-push"
      - "assets/"
      - "operation-guide.md"
      - "install-guide.md"
      - "AGENTS.md"
project_knowledge: null
